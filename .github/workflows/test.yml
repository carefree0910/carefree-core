name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  test:
    name: tests (ubuntu-latest, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints-ci.txt
      - name: Prepare test reports
        run: mkdir -p .artifacts/test
      - name: Install constrained dependencies
        if: matrix.python-version == '3.8'
        run: |
          set -euo pipefail
          {
            python -m pip install --upgrade "pip==24.2"
            python -m pip install \
              --extra-index-url https://download.pytorch.org/whl/cpu \
              -c requirements/constraints-ci.txt \
              torch torchvision
            python -m pip install \
              -c requirements/constraints-ci.txt \
              -e ".[test,onnx]"
            python -m pip check
          } 2>&1 | tee .artifacts/test/install.log
      - name: Install Python 3.14 dependencies
        if: matrix.python-version == '3.14'
        run: |
          set -euo pipefail
          {
            python -m pip install --upgrade pip
            python -m pip install \
              --index-url https://download.pytorch.org/whl/cpu \
              torch torchvision
            python -m pip install -e ".[test,onnx]"
            python -m pip check
          } 2>&1 | tee .artifacts/test/install.log
      - name: Test with pytest
        run: |
          set -euo pipefail
          python -m pytest -v tests \
            --ignore=tests/test_flow \
            --ignore=tests/test_toolkit/test_web.py \
            --deselect=tests/test_learn/test_callbacks.py::TestCallbacks::test_wandb_callback \
            --cov=core --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:.artifacts/test/coverage.xml \
            --cov-report=json:.artifacts/test/coverage.json \
            --junitxml=.artifacts/test/pytest.xml \
            --durations=0 \
            2>&1 | tee .artifacts/test/pytest.log
      - name: Enforce 100% line coverage
        run: |
          set -euo pipefail
          python scripts/check_coverage.py .artifacts/test/coverage.json \
            2>&1 | tee .artifacts/test/coverage-check.log
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carefree-core-test-reports-py${{ matrix.python-version }}
          path: |
            .coverage
            .artifacts/test/**
          if-no-files-found: warn
          include-hidden-files: true

  build:
    name: build (ubuntu-latest, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints-ci.txt
      - name: Prepare build reports
        run: mkdir -p .artifacts/build
      - name: Install constrained dependencies and packaging tools
        if: matrix.python-version == '3.8'
        run: |
          set -euo pipefail
          {
            python -m pip install --upgrade "pip==24.2"
            python -m pip install \
              --extra-index-url https://download.pytorch.org/whl/cpu \
              -c requirements/constraints-ci.txt \
              torch torchvision
            python -m pip install \
              -c requirements/constraints-ci.txt \
              -e ".[test,typing]"
            python -m pip install \
              -c requirements/constraints-ci.txt \
              build setuptools twine
            python -m pip check
          } 2>&1 | tee .artifacts/build/install.log
      - name: Install Python 3.14 dependencies and packaging tools
        if: matrix.python-version == '3.14'
        run: |
          set -euo pipefail
          {
            python -m pip install --upgrade pip
            python -m pip install \
              --index-url https://download.pytorch.org/whl/cpu \
              torch torchvision
            python -m pip install -e ".[test,typing]" build setuptools twine
            python -m pip check
          } 2>&1 | tee .artifacts/build/install.log
      - name: Build and check distributions
        run: |
          set -euo pipefail
          python -m build --sdist --wheel \
            2>&1 | tee .artifacts/build/build.log
          python -m twine check dist/* \
            2>&1 | tee .artifacts/build/twine.log
      - name: Test packaging entry points
        env:
          CFCORE_DIST_DIR: dist
          CFCORE_RUN_PACKAGING_SMOKE: "1"
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_packaging_smoke.py \
            --junitxml=.artifacts/build/pytest.xml \
            2>&1 | tee .artifacts/build/pytest.log
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carefree-core-distributions-py${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carefree-core-build-reports-py${{ matrix.python-version }}
          path: .artifacts/build/**
          if-no-files-found: warn
          include-hidden-files: true

  benchmark-smoke:
    name: benchmark smoke (ubuntu-latest, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.14"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints-ci.txt
      - name: Prepare benchmark reports
        run: mkdir -p .artifacts/benchmarks
      - name: Install constrained dependencies
        if: matrix.python-version == '3.8'
        run: |
          set -euo pipefail
          {
            python -m pip install --upgrade "pip==24.2"
            python -m pip install \
              --extra-index-url https://download.pytorch.org/whl/cpu \
              -c requirements/constraints-ci.txt \
              torch torchvision
            python -m pip install \
              -c requirements/constraints-ci.txt \
              -e ".[benchmark]"
            python -m pip check
          } 2>&1 | tee .artifacts/benchmarks/install.log
      - name: Install Python 3.14 dependencies
        if: matrix.python-version == '3.14'
        run: |
          set -euo pipefail
          {
            python -m pip install --upgrade pip
            python -m pip install \
              --index-url https://download.pytorch.org/whl/cpu \
              torch torchvision
            python -m pip install -e ".[benchmark]"
            python -m pip check
          } 2>&1 | tee .artifacts/benchmarks/install.log
      - name: Run benchmark smoke
        run: |
          set -euo pipefail
          python -m benchmarks.run \
            --profile smoke \
            --output ".artifacts/benchmarks/smoke-py${{ matrix.python-version }}.json" \
            --validate \
            2>&1 | tee ".artifacts/benchmarks/runner-py${{ matrix.python-version }}.log"
      - name: Upload benchmark smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carefree-core-benchmark-smoke-py${{ matrix.python-version }}
          path: .artifacts/benchmarks/**
          if-no-files-found: warn
          include-hidden-files: true
